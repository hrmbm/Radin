<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reimbursement UI v72</title><style>
/* ReHolz Premium Architectural Theme */
:root {
  --wood: #007850;
  --wood-dark: #004C33;
  --wood-deep: #003D29;
  --wood-light: #3FA877;
  --wood-amber: #B77932;
  --timber-forest: #007850;
  --timber-deep: #00553A;
  --timber-pine: #004C33;
  --sage: #D8EBDE;
  --sage-light: #E6F2E9;
  --sand: #EAF3ED;
  --sand-warm: #F4FAF6;
  --bg: #F4F8F5;
  --card: #FFFFFF;
  --card-border: #E0EAE3;
  --txt: #1E2B23;
  --txt-muted: #5E6E63;
  --gray: #74887B;
  --line: #DCE7DE;
  --line-subtle: #E9F1EB;
  --shadow: 0 3px 12px rgba(0, 64, 42, 0.06);
  --shadow-lg: 0 12px 32px rgba(0, 64, 42, 0.12);

  /* Compatibility aliases with legacy classes */
  --blue: #007850;
  --blue2: #00553A;
  --red: #007850;
  --red2: #00553A;
  --green: #007850;
  --amber: #B77932;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  min-height: 100%;
  height: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  min-height: 100dvh;
  overflow-x: hidden;
  padding-bottom: env(safe-area-inset-bottom);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--txt);
  font-size: 15px;
  line-height: 1.45;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  touch-action: manipulation;
}

input, select, textarea {
  font-family: inherit;
  font-size: 15px;
  touch-action: manipulation;
  max-width: 100%;
  min-width: 0;
}

.scr {
  display: none;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: calc(88px + env(safe-area-inset-bottom));
  background: var(--bg);
}

.scr.on {
  display: block;
  animation: fade .24s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes fade {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.wrap {
  max-width: 520px;
  margin: 0 auto;
  padding: 0 16px;
}

/* Header & Topbars */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--line-subtle);
}

.topbar.red {
  background: linear-gradient(145deg, #00402B 0%, #006442 55%, #003D29 100%);
  color: #fff;
  border-radius: 0 0 20px 20px;
  padding-bottom: 18px;
  border-bottom: none;
  box-shadow: 0 4px 18px rgba(0, 120, 80, 0.16);
}

.topbar h1 {
  font-size: 17.5px;
  font-weight: 700;
  flex: 1;
  letter-spacing: -0.01em;
}

.topbar .back {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.05);
  color: var(--txt);
  transition: background 0.15s ease;
}

.topbar .back:active {
  background: rgba(0, 0, 0, 0.1);
}

.topbar.red .back {
  color: #fff;
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(8px);
}

.topbar.red .back:active {
  background: rgba(255, 255, 255, 0.28);
}

.step-sub {
  font-size: 12.5px;
  color: rgba(255, 255, 255, 0.88);
  text-align: center;
  margin-top: 2px;
  font-weight: 500;
}

/* Splash & Login Screens */
#s-splash {
  padding-bottom: 0;
}

.splash-wrap {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(155deg, #003824 0%, #00573A 50%, #002E1E 100%);
  padding: 24px;
}

#s-login {
  display: none;
  min-height: 100vh;
  min-height: 100dvh;
  background: linear-gradient(155deg, #003824 0%, #00573A 50%, #002E1E 100%);
  align-items: center;
  justify-content: center;
  padding: 24px;
}

#s-login.on {
  display: flex;
}

.login-card {
  background: #ffffff;
  border-radius: 24px;
  padding: 32px 26px 28px;
  width: 100%;
  max-width: 388px;
  box-shadow: 0 24px 60px -12px rgba(0, 40, 26, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.4);
}

.login-card h1 {
  text-align: center;
  font-size: 18px;
  font-weight: 800;
  color: var(--txt);
  letter-spacing: 1.5px;
  margin-bottom: 4px;
}

.login-card p {
  text-align: center;
  color: var(--txt-muted);
  font-size: 13px;
  margin-bottom: 22px;
}

.login-logo {
  width: 185px;
  height: auto;
  display: block;
  margin: 0 auto 14px;
}

.splash-logo {
  width: 155px;
  height: auto;
  display: block;
  margin: 0 auto 12px;
}

/* Form Fields */
.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: #3D5043;
  margin-bottom: 6px;
  letter-spacing: 0.01em;
}

.field input, .field select, .field textarea {
  width: 100%;
  padding: 13px 15px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: #FFFFFF;
  color: var(--txt);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--timber-forest);
  box-shadow: 0 0 0 3px rgba(0, 120, 80, 0.12);
}

/* Buttons */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px 16px;
  border-radius: 13px;
  font-size: 15px;
  font-weight: 600;
  transition: transform 0.1s ease, filter 0.15s ease;
}

.btn:active {
  transform: scale(0.98);
}

.btn-blue {
  background: linear-gradient(135deg, #007850 0%, #005C3E 100%);
  color: #fff;
  box-shadow: 0 4px 14px rgba(0, 120, 80, 0.22);
}

.btn-blue:hover {
  filter: brightness(1.05);
}

.btn-red {
  background: linear-gradient(135deg, #007850 0%, #004C33 100%);
  color: #fff;
  box-shadow: 0 4px 14px rgba(0, 120, 80, 0.22);
}

.btn-green {
  background: var(--timber-forest);
  color: #fff;
}

.btn-ghost {
  background: #FFFFFF;
  border: 1.5px solid var(--line);
  color: #3E4F43;
}

.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}

.err {
  color: #9C382A;
  font-size: 13px;
  text-align: center;
  margin-top: 10px;
  min-height: 16px;
}

/* Greet Card */
.greet {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 18px 4px 8px;
}

.greet .ava {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2E9E6B 0%, #007850 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 16px;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0, 64, 42, 0.12);
}

.greet .ava img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.greet small {
  display: block;
  color: var(--txt-muted);
  font-size: 13px;
}

.greet b {
  font-size: 17.5px;
  color: var(--txt);
  letter-spacing: -0.01em;
}

/* Shift Card */
.shift-card {
  background: #ffffff;
  border-radius: 18px;
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-top: 12px;
  border: 1px solid var(--card-border);
}

.shift-head {
  background: linear-gradient(135deg, #007850 0%, #00553A 60%, #003D29 100%);
  color: #fff;
  text-align: center;
  padding: 12px 16px;
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.shift-body {
  padding: 20px 16px 18px;
  text-align: center;
}

.shift-code {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--txt);
}

.shift-hours {
  color: var(--txt-muted);
  font-size: 13.5px;
  margin-top: 4px;
}

.clock-pill {
  display: flex;
  align-items: center;
  background: #FFFFFF;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  margin: 18px 4px 0;
  box-shadow: 0 2px 8px rgba(0, 64, 42, 0.04);
  overflow: hidden;
}

.clock-pill button {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 6px;
  font-size: 15px;
  font-weight: 700;
  background: #FFFFFF;
  transition: background 0.15s ease;
}

.clock-pill button:active {
  background: #F5FAF7;
}

.clock-pill button:disabled {
  opacity: 0.42;
}

.clock-pill .ci {
  color: var(--timber-forest);
}

.clock-pill .co {
  color: var(--wood);
}

.clock-pill .div {
  width: 1.5px;
  background: var(--line);
  align-self: stretch;
  margin: 8px 0;
}

.shift-note {
  margin-top: 14px;
  font-size: 13px;
  color: var(--txt-muted);
}

.shift-note.ok {
  color: var(--timber-forest);
  font-weight: 600;
}

/* ReHolz Menu Grid & Icons */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  background: #ffffff;
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 18px 8px;
  margin-top: 16px;
  border: 1px solid var(--card-border);
}

.menu-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 8px 2px;
  border-radius: 12px;
  transition: background 0.15s ease;
}

.menu-item:active {
  background: #F5FAF7;
}

.menu-ic {
  width: 50px;
  height: 50px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  background: #EDF6F0;
  color: var(--txt);
  border: 1px solid rgba(0, 120, 80, 0.14);
  box-shadow: 0 2px 6px rgba(0, 64, 42, 0.04);
  transition: transform 0.12s ease;
  overflow: hidden;
}

.menu-item:active .menu-ic {
  transform: scale(0.95);
}

.menu-ic svg {
  width: 27px;
  height: 27px;
  display: block;
}

.menu-ic.re-green {
  background: #E8F0EA;
  border-color: rgba(0, 120, 80, 0.16);
  color: #007850;
}

.menu-ic.re-teak {
  background: #EAF4EE;
  border-color: rgba(0, 120, 80, 0.16);
  color: #007850;
}

.menu-ic.re-amber {
  background: #EBF5EE;
  border-color: rgba(183, 121, 50, 0.18);
  color: #A26E2A;
}

.menu-ic.re-olive {
  background: #EAEEE8;
  border-color: rgba(0, 120, 80, 0.16);
  color: #007850;
}

.menu-ic.re-walnut {
  background: #E9F2EB;
  border-color: rgba(0, 85, 58, 0.16);
  color: #00553A;
}

.menu-ic.re-terracotta {
  background: #EBF4EE;
  border-color: rgba(0, 120, 80, 0.18);
  color: #00553A;
}

.menu-ic.re-bronze {
  background: #ECF4EE;
  border-color: rgba(0, 120, 80, 0.16);
  color: #3D5648;
}

.menu-item span {
  font-size: 11.5px;
  font-weight: 500;
  color: #33463A;
  text-align: center;
  line-height: 1.25;
}

/* Sections & Team */
.sec-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 22px 4px 10px;
}

.sec-title h2 {
  font-size: 16.5px;
  font-weight: 700;
  color: var(--txt);
}

.sec-title a {
  color: var(--timber-forest);
  font-size: 13px;
  text-decoration: none;
  font-weight: 600;
}

.team-row {
  display: flex;
  gap: 14px;
  background: #ffffff;
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 16px;
  overflow-x: auto;
  border: 1px solid var(--card-border);
}

.team-ava {
  flex-shrink: 0;
  text-align: center;
  width: 56px;
}

.team-ava .cir {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #E8F1EB;
  color: var(--txt);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  margin: 0 auto;
  overflow: hidden;
  border: 2px solid #FFFFFF;
  box-shadow: 0 2px 6px rgba(0, 64, 42, 0.08);
}

.team-ava .cir img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.team-ava span {
  display: block;
  font-size: 11px;
  color: var(--txt-muted);
  margin-top: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card {
  background: #ffffff;
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 18px;
  margin-top: 14px;
  border: 1px solid var(--card-border);
}

/* Attendance Flow */
.att-shift {
  background: #ffffff;
  border-radius: 16px;
  padding: 14px 16px;
  margin: 12px 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--card-border);
}

.att-shift b {
  font-size: 18px;
  color: var(--txt);
}

.att-shift div {
  color: var(--txt-muted);
  font-size: 13px;
  margin-top: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.warn-banner {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: #EAF4EC;
  color: #007850;
  padding: 12px 16px;
  font-size: 13px;
  border-left: 3.5px solid #B77932;
}

.warn-banner a {
  color: var(--timber-forest);
  font-weight: 700;
  margin-left: auto;
  white-space: nowrap;
}

.map-box {
  margin: 12px 16px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
  background: #E8F1EB;
  height: clamp(210px, 34vh, 300px);
  height: clamp(210px, 34dvh, 300px);
  min-height: 190px;
  position: relative;
  isolation: isolate;
  flex-shrink: 0;
  border: 1px solid var(--card-border);
}

.map-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(248, 246, 240, 0.9);
  z-index: 500;
  font-size: 13px;
  color: #6E6259;
}

.fab-next {
  margin: 16px;
  padding: 0 16px;
}

.cam-wrap {
  position: relative;
  margin: 12px 16px;
  border-radius: 16px;
  overflow: hidden;
  background: #111;
  height: min(58vh, 460px);
  box-shadow: var(--shadow);
}

.cam-wrap video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

.ellipse {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 230px;
  height: 300px;
  border: 2.5px dashed rgba(220, 232, 221, 0.88);
  border-radius: 50%;
  pointer-events: none;
}

.cam-status {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 12px;
  text-align: center;
  color: #fff;
  font-size: 13px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  font-weight: 500;
}

.cam-override {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 34px;
  text-align: center;
  font-size: 12px;
}

.cam-override a {
  color: #A8E6C3;
  text-decoration: underline;
}

.note-box {
  margin: 0 16px;
}

.note-box input {
  width: 100%;
  padding: 14px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: #ffffff;
}

.success-box {
  text-align: center;
  padding: 60px 24px;
}

.success-box .big {
  font-size: 64px;
  margin-bottom: 12px;
}

.success-box h2 {
  margin-bottom: 6px;
  color: var(--txt);
}

.success-box p {
  color: var(--txt-muted);
  font-size: 14px;
}

/* Search Input */
.search {
  margin: 4px 16px 10px;
  position: relative;
}

.search input {
  width: 100%;
  padding: 13px 16px 13px 44px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: #ffffff;
  outline: none;
  transition: border-color 0.15s ease;
}

.search input:focus {
  border-color: var(--timber-forest);
}

.search .ic {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gray);
  font-size: 17px;
  display: flex;
  align-items: center;
}

.date-lbl {
  padding: 12px 20px 6px;
  color: var(--txt-muted);
  font-size: 13.5px;
  font-weight: 500;
}

/* Request List Items */
.req-item {
  background: #ffffff;
  padding: 15px 16px;
  border-bottom: 1px solid var(--line-subtle);
  display: flex;
  gap: 13px;
  transition: background 0.15s ease;
}

.req-item:active {
  background: #F5FAF7;
}

.req-ava {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #E8F1EB;
  color: var(--txt);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
  overflow: hidden;
  border: 1.5px solid #FFFFFF;
  box-shadow: 0 2px 6px rgba(0, 64, 42, 0.08);
}

.req-ava img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.req-body {
  flex: 1;
  min-width: 0;
}

.req-body b {
  font-size: 15px;
  display: block;
  color: var(--txt);
}

.req-body .sub {
  color: var(--txt-muted);
  font-size: 13px;
  margin: 2px 0 6px;
}

.req-body ul {
  list-style: none;
  font-size: 13.5px;
  color: #3E4F43;
}

.req-body li {
  margin: 2px 0;
}

/* Status Pills */
.pill {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  margin-top: 8px;
}

.pill.warn {
  background: #F6EDDE;
  color: #8C5C23;
}

.pill.ok {
  background: #DCEEDF;
  color: #00553A;
}

.pill.no {
  background: #F6E6E3;
  color: #8E3D31;
}

.pill.info {
  background: #E9F1EB;
  color: #00553A;
}

/* Inbox Tabs */
.inbox-tabs {
  display: flex;
  background: #ffffff;
  border-radius: 14px;
  margin: 6px 16px 12px;
  padding: 4px;
  box-shadow: var(--shadow);
  border: 1px solid var(--card-border);
}

.inbox-tabs button {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  color: var(--gray);
  position: relative;
  transition: color 0.15s ease;
}

.inbox-tabs button.on {
  color: var(--timber-forest);
}

.inbox-tabs button.on::after {
  content: '';
  position: absolute;
  left: 20%;
  right: 20%;
  bottom: 2px;
  height: 3px;
  border-radius: 2px;
  background: var(--timber-forest);
}

.badge-n {
  display: inline-block;
  min-width: 20px;
  height: 20px;
  border-radius: 10px;
  background: #8F4232;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  line-height: 20px;
  text-align: center;
  padding: 0 5px;
  margin-left: 5px;
  vertical-align: 1px;
}

.notif-item {
  display: flex;
  gap: 13px;
  background: #ffffff;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line-subtle);
  align-items: center;
}

.notif-ic {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #EAF4EE;
  color: #007850;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  flex-shrink: 0;
  border: 1px solid rgba(0, 120, 80, 0.12);
}

.notif-item b {
  font-size: 14.5px;
  display: block;
  color: var(--txt);
}

.notif-item span {
  font-size: 13px;
  color: var(--txt-muted);
}

.cat-item {
  display: flex;
  align-items: center;
  gap: 14px;
  background: #ffffff;
  padding: 15px 16px;
  border-bottom: 1px solid var(--line-subtle);
}

.cat-item .ci {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #E8F0EA;
  color: var(--timber-forest);
  border: 1px solid rgba(0, 120, 80, 0.12);
}

.cat-item b {
  flex: 1;
  font-size: 15px;
  color: var(--txt);
}

.cat-item .n {
  color: var(--txt-muted);
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 500;
}

/* Detail Hero & Body */
.det-hero {
  position: relative;
  background: #E8F1EB;
  height: 220px;
}

.det-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.det-hero .map-half {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 52%;
}

.det-hero .map-half iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.det-hero .ph-half {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 48%;
  background: #111;
}

.det-hero .ph-half img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.det-pill {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
}

.det-body {
  background: #ffffff;
  border-radius: 20px 20px 0 0;
  margin-top: -18px;
  position: relative;
  z-index: 3;
  padding: 22px 18px;
  min-height: 40vh;
  box-shadow: 0 -4px 16px rgba(0, 64, 42, 0.05);
}

.det-row {
  margin-bottom: 16px;
}

.det-row small {
  display: block;
  color: var(--txt-muted);
  font-size: 13px;
  margin-bottom: 3px;
}

.det-row div {
  font-size: 15px;
  color: var(--txt);
}

.det-row a {
  color: var(--timber-forest);
  font-weight: 600;
  text-decoration: none;
}

.tl {
  position: relative;
  padding-left: 30px;
  margin-top: 6px;
}

.tl::before {
  content: '';
  position: absolute;
  left: 9px;
  top: 12px;
  bottom: 12px;
  width: 2px;
  background: var(--line);
}

.tl-item {
  position: relative;
  padding: 8px 0;
}

.tl-item .dot {
  position: absolute;
  left: -30px;
  top: 12px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: #fff;
}

.tl-item b {
  display: block;
  font-size: 14.5px;
  color: var(--txt);
}

.tl-item span {
  font-size: 12.5px;
  color: var(--txt-muted);
}

.dot.wait { background: #B77932; }
.dot.ok { background: #007850; }
.dot.base { background: #004C33; }
.dot.no { background: #8F4232; }

.det-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}

/* Bottom Tabbar */
#tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  display: flex;
  padding: 7px 4px calc(7px + env(safe-area-inset-bottom));
  box-shadow: 0 -2px 10px rgba(0, 64, 42, 0.04);
}

#tabbar button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 4px 0;
  color: #7E938A;
  font-size: 10.5px;
  font-weight: 600;
  position: relative;
  transition: color 0.15s ease;
}

#tabbar button.on {
  color: var(--timber-forest);
}

#tabbar button.on::before {
  content: '';
  position: absolute;
  top: -7px;
  width: 20px;
  height: 3px;
  border-radius: 2px;
  background: var(--timber-forest);
}

#tabbar .tic {
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

#tabbar .tic svg {
  width: 22px;
  height: 22px;
}

#tabbar .tbadge {
  position: absolute;
  top: -2px;
  left: calc(50% + 6px);
  min-width: 18px;
  height: 18px;
  border-radius: 9px;
  background: #8F4232;
  color: #fff;
  font-size: 10.5px;
  font-weight: 700;
  line-height: 18px;
  text-align: center;
  padding: 0 4px;
}

/* Overlays and Sheets */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 35, 22, 0.45);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.overlay.on {
  display: flex;
}

.sheet {
  background: #ffffff;
  width: 100%;
  max-width: 520px;
  border-radius: 24px 24px 0 0;
  padding: 12px 20px calc(24px + env(safe-area-inset-bottom));
  max-height: 86vh;
  max-height: 86dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  animation: up .25s ease;
  box-shadow: 0 -8px 30px rgba(0, 64, 42, 0.15);
  border-top: 1px solid var(--card-border);
}

.overlay.face-enroll-mode {
  align-items: stretch;
  overflow: auto;
}

.overlay.face-enroll-mode .sheet {
  width: 100%;
  max-width: none;
  height: 100vh;
  height: 100dvh;
  max-height: 100vh;
  max-height: 100dvh;
  border-radius: 0;
  padding: 10px 0 calc(24px + env(safe-area-inset-bottom));
  overflow-y: auto;
  animation: none;
}

.overlay.face-enroll-mode .sheet>.grab {
  display: none;
}

.overlay.face-enroll-mode #shFace {
  padding: 0 0 12px;
}

.overlay.face-enroll-mode #shFace .cam-wrap {
  height: min(58vh, 460px);
  margin: 12px 16px;
}

.overlay.face-enroll-mode #shFace h3,
.overlay.face-enroll-mode #shFace>p,
.overlay.face-enroll-mode #shFace>#faceSaveBtn {
  margin-left: 20px;
  margin-right: 20px;
}

@keyframes up {
  from { transform: translateY(40px); opacity: 0.5; }
  to { transform: none; opacity: 1; }
}

.sheet .grab {
  width: 44px;
  height: 5px;
  border-radius: 3px;
  background: #C7DCCF;
  margin: 4px auto 14px;
}

.sheet h3 {
  font-size: 18px;
  font-weight: 700;
  color: var(--txt);
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.sheet h3 button {
  color: var(--gray);
  display: flex;
  align-items: center;
  justify-content: center;
}

.sheet-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 4px;
  border-bottom: 1px solid var(--line-subtle);
  font-size: 15px;
  font-weight: 500;
  width: 100%;
  text-align: left;
  color: var(--txt);
}

.sheet-item .si {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #EAF4EE;
  color: var(--wood);
  border: 1px solid rgba(0, 120, 80, 0.12);
}

.sheet-item .si svg {
  width: 22px;
  height: 22px;
}

.sheet-item .arr {
  margin-left: auto;
  color: #8FA79A;
  display: flex;
  align-items: center;
}

/* Profile Info */
.prof-head {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 6px 4px 16px;
  border-bottom: 1px solid var(--line-subtle);
  margin-bottom: 8px;
}

.prof-head .ava {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2E9E6B 0%, #007850 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 700;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0, 64, 42, 0.12);
}

.prof-head .ava img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.prof-row {
  display: flex;
  justify-content: space-between;
  padding: 12px 4px;
  border-bottom: 1px solid #EFF6F1;
  font-size: 14px;
}

.prof-row span {
  color: var(--txt-muted);
}

.prof-row b {
  color: var(--txt);
}

/* Month Navigation */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #ffffff;
  margin: 0 16px 8px;
  border-radius: 14px;
  padding: 11px 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--card-border);
}

.month-nav b {
  font-size: 14px;
  color: var(--txt);
}

.month-nav button {
  color: var(--timber-forest);
  font-size: 20px;
  padding: 2px 10px;
  font-weight: 700;
}

.log-row {
  display: flex;
  align-items: center;
  background: #ffffff;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line-subtle);
  gap: 10px;
}

.log-row .d {
  width: 74px;
  font-weight: 700;
  font-size: 13.5px;
  color: var(--txt);
}

.log-row .t {
  flex: 1;
  text-align: center;
  font-size: 13.5px;
  color: #3E4F43;
}

.log-row .s {
  width: 92px;
  text-align: right;
}

.empty {
  padding: 44px 20px;
  text-align: center;
  color: var(--txt-muted);
  font-size: 14px;
}

.empty .big {
  font-size: 42px;
  margin-bottom: 10px;
}

/* Toast */
#toast {
  position: fixed;
  left: 50%;
  bottom: 96px;
  transform: translateX(-50%) translateY(20px);
  background: #0F2E1E;
  color: #fff;
  padding: 11px 22px;
  border-radius: 24px;
  font-size: 13.5px;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: all .25s ease;
  max-width: 88%;
  text-align: center;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
}

#toast.on {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.spin {
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255, 255, 255, 0.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: sp .8s linear infinite;
  display: inline-block;
  vertical-align: -4px;
}

@keyframes sp {
  to { transform: rotate(360deg); }
}

.hint {
  font-size: 12px;
  color: var(--txt-muted);
  text-align: center;
  margin-top: 10px;
}

.seg {
  display: flex;
  background: #E9F2EB;
  border-radius: 12px;
  padding: 4px;
  margin: 0 16px 14px;
}

.seg button {
  flex: 1;
  padding: 9px;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 600;
  color: var(--txt-muted);
  transition: all 0.15s ease;
}

.seg button.on {
  background: #ffffff;
  color: var(--txt);
  box-shadow: 0 2px 6px rgba(0, 64, 42, 0.08);
}

/* Attendance Flow Specific */
#attStep2 {
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}

#attStep2 .fab-next {
  position: relative;
  margin: 14px 16px 24px;
  padding: 0;
}

#attStep2 .note-box {
  margin-bottom: 12px;
}

#attStep1 .fab-next {
  position: relative;
  margin: 16px 16px calc(24px + env(safe-area-inset-bottom));
  padding: 0;
}

.admin-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.admin-actions button {
  flex: 1;
  padding: 10px 8px;
  font-size: 12.5px;
  border-radius: 10px;
  font-weight: 600;
}

/* Organization Tree */
.org-top {
  padding: 14px;
  text-align: center;
  color: var(--txt-muted);
  font-size: 13px;
}

.org-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 150px;
}

.org-kids {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 14px 6px 6px;
  width: 100%;
  border-top: 2px solid var(--line);
  margin-top: 12px;
}

.org-card {
  background: #ffffff;
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 14px 10px;
  width: 150px;
  flex-shrink: 0;
  text-align: center;
  position: relative;
  margin-top: 12px;
  border: 1px solid var(--card-border);
}

.org-card::before {
  content: '';
  position: absolute;
  top: -14px;
  left: 50%;
  width: 2px;
  height: 14px;
  background: var(--line);
}

.org-ava {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #E8F1EB;
  color: var(--txt);
  margin: 0 auto 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  overflow: hidden;
  border: 2px solid var(--timber-forest);
  font-size: 16px;
}

.org-ava img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.org-nik {
  font-size: 11px;
  color: var(--txt-muted);
}

.org-nama {
  font-size: 13px;
  font-weight: 700;
  color: var(--txt);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.org-pos {
  font-size: 11px;
  color: var(--txt-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.org-badge {
  position: absolute;
  top: -8px;
  right: -8px;
  min-width: 22px;
  height: 22px;
  border-radius: 11px;
  background: #6E8579;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  line-height: 22px;
  text-align: center;
  padding: 0 5px;
}

.org-badge.on {
  background: var(--timber-forest);
}

.org-node.hit .org-card {
  outline: 3px solid #B77932;
}

.pin-display {
  background: #EAF6EF;
  padding: 14px;
  border-radius: 12px;
  margin-top: 10px;
  text-align: center;
  border: 1px dashed #B77932;
}

.pin-display b {
  font-size: 24px;
  letter-spacing: 3px;
  color: #007850;
}

.karyawan-form .field {
  margin-bottom: 12px;
}

.karyawan-form .row2 {
  display: flex;
  gap: 10px;
}

.karyawan-form .row2 .field {
  flex: 1;
}

/* Micro-icons & SVGs */
.ic-back {
  width: 20px;
  height: 20px;
  display: block;
}

.sh-x {
  width: 22px;
  height: 22px;
  display: block;
}

.h1-ic {
  width: 20px;
  height: 20px;
  vertical-align: -4px;
}

.big-check {
  width: 88px;
  height: 88px;
  display: block;
  margin: 0 auto 12px;
}

.warn-ic {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

.clk-ic {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

/* ---------- Login split-panel gaya Apps Script (desktop saja) ---------- */

    width: 132px;

    border-radius: 16px;

    box-shadow: 0 10px 24px rgba(0, 30, 20, 0.25);

  .rk-nav-label { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #8AA093; padding: 10px 10px 6px; }
  .rk-nav { display: flex; flex-direction: column; gap: 2px; }
  .rk-nav button {

    border-radius: 9px; font-size: 13.5px; font-weight: 600;

  .rk-nav button:hover { background: #EDF5EF; color: var(--rk-green); }

  .rk-side-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--rk-line); }
  .rk-side-foot button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: transparent; border: none; color: #8F4232;
    font-size: 13px; font-weight: 600; padding: 9px 12px; border-radius: 9px; cursor: pointer;
    font-family: inherit;
  }
  .rk-side-foot button:hover { background: #FBEFEC; }

  /* Topbar */
  .rk-top {
    grid-column: 2;
    display: flex; align-items: center; gap: 16px;
    background: #FFFFFF; border-bottom: 1px solid var(--rk-line);
    padding: 0 26px;

  .rk-top h1 { font-size: 17px; font-weight: 800; margin: 0; letter-spacing: 0.2px; }

  .rk-bar-row .trk { flex: 1; height: 22px; background: #EFF5F0; border-radius: 6px; overflow: hidden; display: block; }

  .rk-pager button { min-width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--rk-line); background: #fff; cursor: pointer; font-weight: 700; font-size: 12px; color: #33503F; }
  .rk-pager button.on { background: var(--rk-green); border-color: var(--rk-green); color: #fff; }
  .rk-pager button:disabled { opacity: .4; cursor: default; }

    border: 1px solid var(--rk-line); border-radius: 13px; background: #fff; margin-bottom: 10px;
  }

  .rk-appr-item .b .s { font-size: 12px; color: var(--rk-muted); margin-top: 2px; }

  .rk-face-prog i { display: block; height: 100%; background: linear-gradient(90deg, #2E9E6B, #007850); border-radius: 6px; transition: width .5s ease; }

  .rk-modal-shade {
    position: fixed; inset: 0; background: rgba(10, 30, 20, 0.45); z-index: 900;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .rk-modal {
    background: #fff; border-radius: 18px; width: 100%; max-width: 480px;
    padding: 22px 24px; box-shadow: 0 30px 80px rgba(0, 40, 26, 0.35);

  }

  .rk-modal .f { margin-bottom: 11px; }
  .rk-modal .f label { display: block; font-size: 11.5px; font-weight: 700; color: var(--rk-muted); margin-bottom: 5px; }
  .rk-modal .f input, .rk-modal .f select {
    width: 100%; padding: 9px 12px; border: 1.5px solid var(--rk-line); border-radius: 10px;

  .rk-modal .row { display: flex; gap: 10px; }
  .rk-modal .row .f { flex: 1; }
  .rk-modal .acts { display: flex; gap: 10px; margin-top: 16px; }

  .rk-toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #14352A; color: #fff; padding: 11px 20px; border-radius: 12px;
    font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none;
    transition: all .25s ease; z-index: 1200; box-shadow: 0 12px 30px rgba(0,0,0,.25);
  }
  .rk-toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Overlay sheet bawaan (Tambah/Edit karyawan) tampil sebagai modal di desktop */
  body.rh-desk-on #ov.on { z-index: 950; }
  body.rh-desk-on .sheet { max-width: 560px; margin: 0 auto; border-radius: 18px 18px 0 0; }
}


/* ==========================================================================
   ReHolz Desktop HR Console v15 — struktur menu & halaman mengikuti HRMSMBM
   (grup submenu lipat, halaman Cuti/Rekap/Laporan/User/Log/Personal File),
   dengan palet hijau ReHolz. Semua aturan di-scope ke >=1024px agar tampilan
   mobile tidak berubah sama sekali.
   ========================================================================== */
@media (min-width: 1024px) {
  body.rh-desk-on #rhDesk { grid-template-columns: 252px 1fr; grid-template-rows: 60px 1fr; }

  /* Grup menu lipat (pola HRMSMBM) */
  .rk-group { margin: 1px 0; }
  .rk-parent {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 9px 12px; border: none; background: transparent; border-radius: 9px;
    font-size: 13px; font-weight: 800; letter-spacing: 0.2px; color: #2E4A3A;
    cursor: pointer; font-family: inherit; text-align: left;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .rk-parent svg { flex: 0 0 auto; }
  .rk-parent:hover { background: #EDF5EF; color: #007850; }
  .rk-chev { margin-left: auto; font-size: 10px; color: #8AA093; transition: transform 0.18s ease; }
  .rk-group.closed .rk-chev { transform: rotate(-90deg); }
  .rk-sub {
    display: flex; flex-direction: column; gap: 2px;
    margin: 2px 0 8px 18px; padding-left: 12px; border-left: 2px solid #E4F0E8;
  }
  .rk-group.closed .rk-sub { display: none; }
  .rk-sub button {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 7px 12px; border: none; background: transparent; border-radius: 8px;
    font-size: 12.8px; font-weight: 600; color: #4A6355; cursor: pointer;
    text-align: left; font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .rk-sub button:hover { background: #EDF5EF; color: #007850; }
  .rk-sub button.on { background: var(--rk-green); color: #fff; box-shadow: 0 4px 12px rgba(0, 120, 80, 0.22); }
  .rk-sub button .rk-badge { margin-left: auto; background: #B77932; color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 7px; }
  .rk-sub button.on .rk-badge { background: rgba(255, 255, 255, 0.25); }

  /* Komponen halaman baru */
  .rk-profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 18px; }
  .rk-profile-grid .pf { background: #F8FBF9; border: 1px solid var(--rk-line); border-radius: 10px; padding: 9px 12px; }
  .rk-profile-grid .pf label { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; color: var(--rk-muted); text-transform: uppercase; }
  .rk-profile-grid .pf b { font-size: 13px; color: var(--rk-ink); word-break: break-word; }
  .rk-chipbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .rk-chip { padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--rk-line); background: #fff; font-size: 11.5px; font-weight: 700; color: #33503F; }
  .rk-chip b { color: var(--rk-green); }
  select.rk-role { padding: 5px 8px; border: 1.5px solid var(--rk-line); border-radius: 8px; font-size: 12px; font-family: inherit; background: #fff; color: var(--rk-ink); }
  .rk-pct { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--rk-green); }

  /* Cetak Laporan HR: hanya halaman aktif yang tercetak */
  @media print {
    body.rh-desk-on .rk-side, body.rh-desk-on .rk-top,
    body.rh-desk-on .rk-toolbar, body.rh-desk-on .rk-btn { display: none !important; }
    body.rh-desk-on #rhDesk { position: static; display: block; }
    body.rh-desk-on .rk-main { overflow: visible; padding: 0; }
    body.rh-desk-on .rk-card { box-shadow: none; }
  }
}

    return {cap:cap,spent:spent,reserved:reserved,available:available};
  }
  var activeInfo=categoryInfo(cat==='ENTERTAIN'?'entertain':'transport');
  var entertainInfo=categoryInfo('entertain'),transportInfo=categoryInfo('transport');
  var available=Number(active.available==null?activeInfo.available:active.available);
  var spent=Number(active.spent||active.approved||active.used||activeInfo.spent);
  var reserved=Number(active.pending_reserved||active.reserved||activeInfo.reserved);
  var periodText=(period.start_date||b.period_start||'')+' - '+(period.end_date||b.period_end||'');
  var history=RH_REIMBURSEMENT_STATE.requests.map(function(x){
    var status=String(x.status||x.final_status||'PENDING').toUpperCase();
    var tone=/DISETUJUI|APPROVED/.test(status)?'ok':(/DITOLAK|REJECT/.test(status)?'no':'warn');
    var statusLabel=status.replace(/_/g,' ');
    var catName=String(x.category||'').toUpperCase()==='ENTERTAIN'?'Entertain':'Transport';
    var requestId=reimbursementRequestId(x);
    var dateLabel=String(x.request_date||x.tanggal||'-');
    var amountLabel=reimbursementMoney(x.amount||x.nominal);
    var note=String(x.note||x.catatan||'');
    var over=Number(x.over_budget_amount||0);
    return '<button type="button" class="reimbursement-history-item" aria-label="Buka pengajuan '+esc(catName)+' '+esc(dateLabel)+' '+esc(amountLabel)+'" onclick="openReimbursementHistoryDetail(\''+esc(requestId)+'\')">'+
      '<span class="reimbursement-history-top"><span class="reimbursement-history-category">'+esc(catName)+'</span><span class="rk-pill '+tone+'">'+esc(statusLabel)+'</span></span>'+
      '<span class="reimbursement-history-main"><strong>'+esc(amountLabel)+'</strong><span>'+esc(dateLabel)+'</span></span>'+
      (note?'<span class="reimbursement-history-note">'+esc(note)+'</span>':'')+
      (over>0?'<span class="reimbursement-history-over">Overbudget '+reimbursementMoney(over)+'</span>':'')+
      '<span class="reimbursement-history-arrow" aria-hidden="true">›</span></button>';
  }).join('');
  host.innerHTML=
    '<section class="reimbursement-summary reimbursement-summary-single" aria-label="Ringkasan saldo">'+
      '<div class="reimbursement-balance">'+
        '<div class="reimbursement-balance-main"><small>SALDO TERSEDIA</small><strong>'+reimbursementMoney(available)+'</strong><span class="reimbursement-period">Periode '+esc(periodText)+'</span></div>'+
        '<div class="reimbursement-balance-breakdown"><div><small>Disetujui</small><b>'+reimbursementMoney(spent)+'</b></div><div><small>Menunggu</small><b>'+reimbursementMoney(reserved)+'</b></div></div>'+
      '</div>'+
    '</section>'+
    '<div class="reimbursement-tabs" role="tablist" aria-label="Kategori Reimbursement">'+
      '<button type="button" role="tab" aria-selected="'+(cat==='ENTERTAIN'?'true':'false')+'" class="'+(cat==='ENTERTAIN'?'on':'')+'" onclick="setReimbursementCategory(\'ENTERTAIN\')"><span>Entertain</span><small>Tersedia '+reimbursementMoney(entertainInfo.available)+'</small></button>'+
      '<button type="button" role="tab" aria-selected="'+(cat==='TRANSPORT'?'true':'false')+'" class="'+(cat==='TRANSPORT'?'on':'')+'" onclick="setReimbursementCategory(\'TRANSPORT\')"><span>Transport</span><small>Tersedia '+reimbursementMoney(transportInfo.available)+'</small></button>'+
    '</div>'+
    '<div class="reimbursement-workspace">'+
      '<section class="card reimbursement-form-card" aria-labelledby="rhReimbursementFormTitle">'+
        '<header class="reimbursement-section-head"><div><span class="reimbursement-eyebrow">FORM PENGAJUAN</span><h3 id="rhReimbursementFormTitle">Pengajuan '+title+'</h3><p>Catat pengeluaran dan lampirkan bukti transaksi.</p></div><span class="reimbursement-category-chip">'+title+'</span></header>'+
        '<div class="reimbursement-form-grid">'+
          '<div class="reimbursement-field reimbursement-field-date"><label for="rhReimbursementDate">Tanggal pengeluaran</label><input id="rhReimbursementDate" type="date" min="'+esc(period.start_date||b.period_start||'')+'" max="'+esc(typeof jakartaTodayISO==='function'?jakartaTodayISO():new Date().toISOString().slice(0,10))+'" value="'+esc(typeof jakartaTodayISO==='function'?jakartaTodayISO():new Date().toISOString().slice(0,10))+'"></div>'+
          '<div class="reimbursement-field reimbursement-field-amount"><label for="rhReimbursementAmount">Nominal pengeluaran</label><div class="reimbursement-input-prefix"><span>Rp</span><input id="rhReimbursementAmount" type="number" min="1" step="1000" inputmode="numeric" placeholder="0" oninput="updateReimbursementSubmitButton()"></div></div>'+
          '<div class="reimbursement-field reimbursement-field-note"><label for="rhReimbursementNote">Catatan pengeluaran <span id="rhReimbursementNoteRequired" class="reimbursement-muted">(opsional)</span></label><textarea id="rhReimbursementNote" rows="4" placeholder="Jelaskan keperluan pengeluaran secara singkat"></textarea></div>'+
          '<div class="reimbursement-field reimbursement-field-file"><label for="rhReimbursementFile">Bukti transaksi <b style="color:#B42318">Wajib</b></label><input id="rhReimbursementFile" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required><small class="reimbursement-muted">Format JPG, PNG, WEBP, atau PDF. Ukuran maksimal 8 MB.</small></div>'+
        '</div>'+
        '<div id="rhReimbursementOverNote" class="reimbursement-over-note" role="note"><b>Pengajuan melebihi saldo tersedia.</b><span>Catatan pengeluaran wajib diisi untuk pengajuan Over Budget.</span></div>'+
        '<footer class="reimbursement-form-footer"><span>Pastikan tanggal, nominal, dan bukti transaksi sudah benar.</span><button class="btn btn-blue reimbursement-submit" id="rhReimbursementSubmit" type="button" onclick="submitReimbursementRequest()">Ajukan</button></footer>'+
      '</section>'+
      '<aside class="card reimbursement-history-panel" aria-labelledby="rhReimbursementHistoryTitle">'+
        '<header class="reimbursement-history-head"><div><span class="reimbursement-eyebrow">PEMANTAUAN</span><h3 id="rhReimbursementHistoryTitle">Riwayat Pengajuan</h3><p>Periksa status pengajuan sebelumnya.</p></div><button class="btn btn-ghost reimbursement-refresh" type="button" onclick="loadReimbursementPage()" aria-label="Muat ulang riwayat">Muat ulang</button></header>'+
        '<div class="reimbursement-history-list">'+(history||'<div class="reimbursement-history-empty"><span class="reimbursement-history-empty-icon">↗</span><b>Belum ada pengajuan</b><span>Pengajuan yang Anda kirim akan tampil di sini.</span></div>')+'</div>'+
      '</aside>'+
    '</div>';
  updateReimbursementSubmitButton();
}
function updateReimbursementSubmitButton(){
  var amountEl=document.getElementById('rhReimbursementAmount'),btn=document.getElementById('rhReimbursementSubmit'),noteLabel=document.getElementById('rhReimbursementNoteRequired'),overNote=document.getElementById('rhReimbursementOverNote');
  if(!amountEl||!btn)return;var amount=Number(amountEl.value||0),available=Number(reimbursementCategoryData().available||0),over=amount>available&&amount>0;
  btn.textContent=over?'Ajukan Over Budget':'Ajukan';btn.classList.toggle('over',over);
  if(noteLabel)noteLabel.textContent=over?'(wajib untuk Over Budget)':'(opsional)';
  if(overNote){overNote.style.display=over?'block':'none';overNote.classList.toggle('is-visible',over);}
}
function setReimbursementCategory(category){RH_REIMBURSEMENT_STATE.category=category==='TRANSPORT'?'TRANSPORT':'ENTERTAIN';paintReimbursementPage();}
function submitReimbursementRequest(){
  if(!rhIsHybridUser()){toast('Reimbursement hanya tersedia untuk job code HYBRID.');return;}
  var dateEl=document.getElementById('rhReimbursementDate'),amountEl=document.getElementById('rhReimbursementAmount'),noteEl=document.getElementById('rhReimbursementNote'),fileEl=document.getElementById('rhReimbursementFile');
  var amount=Number(amountEl&&amountEl.value||0),date=String(dateEl&&dateEl.value||''),note=String(noteEl&&noteEl.value||'').trim(),category=RH_REIMBURSEMENT_STATE.category;
  var available=Number(reimbursementCategoryData().available||0),over=amount>available;
  if(!date||!Number.isFinite(amount)||amount<=0){toast('Isi tanggal dan nominal pengajuan dengan benar.');return;}
  if(over&&!note){toast('Catatan wajib diisi untuk pengajuan Overbudget.');if(noteEl)noteEl.focus();return;}
  var file=fileEl&&fileEl.files&&fileEl.files[0]?fileEl.files[0]:null;
  if(!file){toast('Bukti transaksi wajib dilampirkan.');if(fileEl)fileEl.focus();return;}
  if(file.size>8*1024*1024){toast('Ukuran lampiran maksimal 8 MB.');return;}
  if(!['image/jpeg','image/png','image/webp','application/pdf'].includes(String(file.type||'').toLowerCase())){toast('Lampiran harus berupa JPG, PNG, WEBP, atau PDF.');return;}
  var btn=document.getElementById('rhReimbursementSubmit');
  function proceedImmediately(){
    if(btn){btn.disabled=true;btn.textContent='Mengunggah bukti...';}
    var reader=new FileReader();reader.onload=function(e){
      var data=e&&e.target?e.target.result:null;
      api('uploadReimbursementAttachment',[category,data],45000).then(function(upload){
        if(!upload||!upload.storagePath)throw new Error((upload&&upload.message)||'Upload bukti transaksi belum dikonfirmasi.');
        if(btn)btn.textContent='Mengirim pengajuan...';
        return reimbursementRpc('hr_submit_reimbursement_request',{p_category:category,p_tanggal:date,p_nominal:amount,p_catatan:note,p_lampiran:upload.storagePath}).then(function(result){
          if(!result||result.ok===false)throw new Error((result&&result.message)||'Backend belum mengonfirmasi pengajuan.');
          toast(result.message||'Pengajuan Reimbursement berhasil dikirim.');return loadReimbursementPage();
        });
      }).catch(function(err){toast(err&&err.message||'Pengajuan Reimbursement gagal dikirim.');}).finally(function(){if(btn){btn.disabled=false;updateReimbursementSubmitButton();}});
    };
    reader.onerror=function(){toast('Bukti transaksi gagal dibaca. Silakan pilih ulang.');if(btn){btn.disabled=false;updateReimbursementSubmitButton();}};
    reader.readAsDataURL(file);
  }
  proceedImmediately();
}
window.addEventListener('DOMContentLoaded',paintReimbursementPage);
</script></body></html>
